name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hh_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Apply DB Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hh_dev
        run: pnpm --filter @hh/db exec tsx src/migrate.ts

      - name: Run Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hh_dev
          REDIS_URL: redis://localhost:6379
          ADMIN_ACCESS_KEY: test_admin_access_key
          ADMIN_PASSWORD: test_admin_master_password
          ADMIN_SESSION_SECRET: test_session_secret_for_ci_pipeline_32char
          AUTH_JWT_SECRET: test_jwt_secret_for_ci_pipeline_32char
        run: pnpm test

      - name: Build Web Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          APP_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hh_dev
        run: pnpm --filter @hh/web build

      - name: Build Worker
        run: pnpm --filter @hh/worker build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: hh-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: hh-worker:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
